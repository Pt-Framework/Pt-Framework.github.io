name: Deploy Website

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "Build and Deploy Website"
    runs-on: windows-2022
    permissions:
      contents: write
    
    steps:
      - name: Checkout Pt-Framework
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Wichtig für Push-Berechtigungen

      - name: Checkout Pt
        uses: actions/checkout@v6
        with:
          repository: Pt-Framework/Pt
          path: pt-source

      - name: Install Doxygen 1.8.6 (Windows)
        shell: pwsh
        run: |
          $url = "https://sourceforge.net/projects/doxygen/files/rel-1.8.8/doxygen-1.8.8.windows.x64.bin.zip/download"
          Invoke-WebRequest -Uri $url -OutFile "doxygen.zip" -UserAgent "NativeHost"
          Expand-Archive -Path "doxygen.zip" -DestinationPath "doxygen-bin"
          echo "$pwd\doxygen-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Website
        shell: pwsh
        run: |
          cd pt-source/doc
          doxygen Doxyfile
          New-Item -Path ".nojekyll" -ItemType File -Force

      - name: Deploy Website
        shell: pwsh
        run: |
          Get-ChildItem -Exclude ".git", ".github", "pt-source" | Remove-Item -Recurse -Force
          
          Copy-Item -Path "pt-source/doc\*" -Destination "." -Recurse -Force

          Remove-Item -Path "pt-source" -Recurse -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          $status = git status --porcelain
          if ($status) {
              git commit -m "Update website from Pt/doc (manual deploy)"
              git push origin main
          } else {
              Write-Host "No changes to commit."
          }
